<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jone & Jon - Hori ere ingenun</title>
    <!-- Google Fonts tipografia dotoreak erabiltzeko -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2C302E; /* Fondo oscuro por si la imagen tarda en cargar */
            text-align: center;
        }

        /* Contenedor de la foto para que marque el alto real de la página */
        .scrollable-bg {
            position: relative;
            width: 100%;
        }

        .scrollable-bg img {
            width: 100%;
            min-height: 100vh; /* Asegura que la imagen ocupe AL MENOS toda la altura de la pantalla (ideal para móviles) */
            object-fit: cover; /* Recorta la imagen proporcionalmente si es necesario para que no queden huecos negros ni se deforme */
            display: block;
        }

        .scrollable-bg .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 48, 46, 0.3); /* Filtro oscuro para que resalte bien el texto blanco */
        }

        /* Goiburua - Pantaila erdian zentratuta eta finko (FIJO) */
        .hero {
            position: fixed; /* Esto hace que el texto se quede clavado en la pantalla */
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: none; /* Permite hacer scroll aunque pongas el dedo/ratón sobre el texto */
            z-index: 10;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-weight: normal;
            font-size: 5em; /* Un poco más grande para que destaque más */
            margin: 0;
            color: white;
            text-shadow: 2px 3px 6px rgba(0,0,0,0.4); /* Sombra para que se lea bien sobre la foto */
        }

        .hero p {
            font-size: 2em; /* Texto secundario más grande también */
            font-style: italic;
            font-family: 'Playfair Display', serif;
            letter-spacing: 2px;
            margin-top: 15px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }

        /* Mugikorretarako egokitzapena */
        @media (max-width: 600px) {
            .hero h1 { font-size: 3.5em; }
            .hero p { font-size: 1.5em; }
        }
    </style>
</head>
<body>

    <!-- Fondo scrolleable con la imagen completa -->
    <div class="scrollable-bg">
        <div class="overlay"></div>
        <img src="ezkontza.jpg" alt="Jone eta Jon Ezkontza">
    </div>

    <!-- Testu nagusia (fijo en el centro de la pantalla) -->
    <div class="hero">
        <h1>Jone & Jon</h1>
        <p>hori ere ingenun</p>
    </div>

</body>
</html>
